name: Check Resolved Schemas

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-resolved-schemas:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: 'pip'

      - name: Install dependencies
        run: pip install -e ".[test]"

      - name: Verify resolved schemas are up-to-date
        run: make check-resolved-schemas
